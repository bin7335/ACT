# CodeRabbit 설정 — https://docs.coderabbit.ai/reference/configuration
language: "ko-KR"
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "develop"
      - "main"
  path_filters:
    - "!package-lock.json"
    - "!worker-configuration.d.ts"
    - "!drizzle/meta/**"
chat:
  auto_reply: true
